name: pixel-office

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PIXEL_OFFICE_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
