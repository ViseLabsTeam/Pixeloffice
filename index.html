<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Office</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="src/styles/main.css" rel="stylesheet">
</head>
<body>
    <div id="modal-welcome" class="modal active">
        <div class="bg-gray-800 rounded-xl border border-gray-700 w-full max-w-md shadow-2xl overflow-hidden flex flex-col pointer-events-auto p-6 text-white max-h-[90vh] overflow-y-auto">
            <h1 class="pixel-font text-lg mb-1 text-blue-400 text-center">PIXEL OFFICE</h1>
            <p class="text-xs text-gray-400 mb-6 text-center">v1.0.23 (Custom PNG Skins & Stable P2P)</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-300 mb-1 font-semibold">Tu Nombre</label>
                    <input type="text" id="welcome-name" value="Developer" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-sm text-white outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-300 mb-2 font-semibold">Elige tu Color Corporativo (si no usas skin)</label>
                    <div class="flex justify-between items-center px-4" id="color-options-container">
                        <div class="color-option selected" data-color="#3b82f6" style="background: #3b82f6;"></div>
                        <div class="color-option" data-color="#ef4444" style="background: #ef4444;"></div>
                        <div class="color-option" data-color="#22c55e" style="background: #22c55e;"></div>
                        <div class="color-option" data-color="#eab308" style="background: #eab308;"></div>
                        <div class="color-option" data-color="#a855f7" style="background: #a855f7;"></div>
                        <div class="color-option" data-color="#ec4899" style="background: #ec4899;"></div>
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-300 mb-1 font-semibold">O sube tu propio Skin PNG (Opcional)</label>
                    <div class="flex items-center space-x-3 bg-gray-900 border border-gray-600 rounded-lg p-2">
                        <input type="file" id="welcome-skin-file" accept="image/png" class="w-full text-xs text-gray-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer">
                    </div>
                    <div class="mt-2 flex items-center space-x-2">
                        <img id="welcome-skin-preview" class="w-10 h-10 object-contain bg-gray-800 rounded border border-gray-600 hidden" alt="Preview">
                        <span id="welcome-skin-name" class="text-[11px] text-gray-400 italic">NingÃºn archivo seleccionado</span>
                    </div>
                </div>
            </div>
            
            <button id="btn-enter-office" class="mt-8 w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition cursor-pointer text-sm tracking-wide">
                Entrar a la Oficina ðŸš€
            </button>
        </div>
    </div>

    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        
        <div id="video-layer" class="absolute top-0 left-0 w-full h-full pointer-events-none overflow-hidden">
            <div id="screenshare-container" class="screenshare-container pointer-events-auto shadow-2xl is-popup">
                <div class="drag-handle flex justify-between items-center bg-gray-800 text-xs text-white p-1 px-2 rounded-t-lg cursor-move select-none" id="screenshare-handle">
                    <span><i class="fas fa-desktop mr-1"></i> Screen Share</span>
                    <button id="close-screenshare" class="text-gray-400 hover:text-red-400 transition cursor-pointer p-1"><i class="fas fa-times"></i></button>
                </div>
                <div class="screenshare-wrapper">
                    <video id="screenshare-video" autoplay playsinline></video>
                </div>
                <div class="resize-handle-bl" id="screenshare-resize-bl"></div>
            </div>
        </div>

        <div id="ui-layer" class="absolute top-0 left-0 w-full h-full pointer-events-none flex flex-col justify-between p-4">
            <div class="flex justify-between items-start pointer-events-auto">
                <div class="bg-gray-800/90 backdrop-blur rounded-lg p-3 border border-gray-700 shadow-lg text-white max-w-xs">
                    <h1 class="pixel-font text-[11px] mb-1 text-blue-400 leading-tight">PIXEL OFFICE <br><span class="text-[9px] text-gray-500">v1.0.23</span></h1>
                    <p class="text-[10px] text-gray-300 font-semibold mb-1" id="room-display">Room: Connecting...</p>
                    <div class="flex items-center space-x-2 mt-1">
                        <div id="net-status-dot" class="w-2.5 h-2.5 rounded-full bg-yellow-500 animate-pulse"></div>
                        <span id="net-status-text" class="text-[11px] text-gray-400">Conectando red P2P...</span>
                    </div>
                </div>
                <button id="btn-settings" class="bg-gray-800/80 hover:bg-gray-700 backdrop-blur rounded-lg p-3 text-white border border-gray-700 transition cursor-pointer">
                    <i class="fas fa-cog text-xl"></i>
                </button>
            </div>

            <div id="interaction-hint" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black/70 text-white px-4 py-2 rounded-full font-bold tracking-wider hidden transition-opacity">
                Press [E] to Interact
            </div>

            <div id="joystick-left" class="joystick-zone pointer-events-auto">
                <div id="joystick-knob" class="absolute top-1/2 left-1/2 w-10 h-10 bg-white/50 rounded-full transform -translate-x-1/2 -translate-y-1/2"></div>
            </div>
            <button id="btn-action-mobile" class="action-btn pointer-events-auto flex items-center justify-center">E</button>
        </div>
    </div>

    <div id="modal-settings" class="modal">
        <div class="bg-gray-800 rounded-xl border border-gray-700 w-full max-w-md shadow-2xl overflow-hidden flex flex-col pointer-events-auto max-h-[90vh] overflow-y-auto">
            <div class="p-4 border-b border-gray-700 flex justify-between items-center bg-gray-900 text-white">
                <h2 class="text-lg font-bold"><i class="fas fa-sliders-h mr-2 text-blue-400"></i>Settings & Profile</h2>
                <button class="text-gray-400 hover:text-white close-modal cursor-pointer"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-6 space-y-4 text-gray-200">
                <div>
                    <label class="block text-xs text-gray-400 mb-1 font-semibold">Cambiar Nombre</label>
                    <input type="text" id="settings-name-input" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-sm text-white outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-xs text-gray-400 mb-1 font-semibold">Subir nuevo Skin PNG</label>
                    <div class="flex items-center space-x-3 bg-gray-900 border border-gray-600 rounded-lg p-2">
                        <input type="file" id="settings-skin-file" accept="image/png" class="w-full text-xs text-gray-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <button id="toggle-cam" class="flex flex-col items-center justify-center p-4 bg-gray-700 hover:bg-gray-600 rounded-lg transition text-red-400 cursor-pointer">
                        <i class="fas fa-video-slash text-2xl mb-2"></i>
                        <span class="text-sm">Camera Off</span>
                    </button>
                    <button id="toggle-mic" class="flex flex-col items-center justify-center p-4 bg-gray-700 hover:bg-gray-600 rounded-lg transition text-red-400 cursor-pointer">
                        <i class="fas fa-microphone-slash text-2xl mb-2"></i>
                        <span class="text-sm">Mic Off</span>
                    </button>
                </div>
                <button id="toggle-screen" class="w-full flex items-center justify-center p-3 bg-blue-600 hover:bg-blue-500 rounded-lg transition text-white font-semibold cursor-pointer">
                    <i class="fas fa-desktop mr-2"></i> Share Screen
                </button>

                <hr class="border-gray-700">

                <div>
                    <label class="block text-xs text-gray-400 mb-1">Invite Friends Link</label>
                    <div class="flex">
                        <input type="text" id="invite-link" readonly class="flex-1 bg-gray-900 border border-gray-600 rounded-l-lg p-2 text-sm text-gray-300 outline-none">
                        <button id="btn-copy-invite" class="bg-gray-700 hover:bg-gray-600 px-4 rounded-r-lg border-y border-r border-gray-600 transition cursor-pointer">
                            <i class="fas fa-copy text-white"></i>
                        </button>
                    </div>
                </div>

                <hr class="border-gray-700">

                <div class="flex items-center justify-between">
                    <span class="text-sm">Mobile Joysticks</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="toggle-joystick" class="sr-only peer">
                        <div class="w-11 h-6 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-500"></div>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-snake" class="modal">
        <div class="bg-gray-900 rounded-xl border-4 border-gray-700 p-6 flex flex-col items-center pointer-events-auto">
            <h2 class="pixel-font text-green-400 mb-4 text-xl">SNAKE ARCADE</h2>
            <div class="bg-black border-2 border-gray-700 p-1 rounded">
                <canvas id="snake-canvas" width="300" height="300" class="block"></canvas>
            </div>
            <div class="mt-4 flex justify-between w-full text-white pixel-font text-xs">
                <span>SCORE: <span id="snake-score" class="text-yellow-400">0</span></span>
                <button id="btn-close-snake" class="text-red-400 hover:text-red-300 cursor-pointer">EXIT</button>
            </div>
            <p class="text-gray-500 text-xs mt-4 max-w-[300px] text-center">Use Arrow Keys or WASD to play.</p>
        </div>
    </div>


    <script type="module" src="src/js/main.js"></script>
</body>
</html>
